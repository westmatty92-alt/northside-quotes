# .github/workflows/qa-staging.yml: TEMPLATE (owned by bl-devops). QA's smoke suite on every successful staging deploy.
name: qa-staging

on:
  deployment_status:

permissions:
  contents: read

# Vercel creates the GitHub deployment with ref = the commit SHA (never the branch name) and environment = Preview,
# and only when Settings → Git → "deployment_status Events" is on. So "is this staging?" = deployment.sha equals the
# head of the staging branch. Never test deployment.ref == 'staging' (always false; verified Nov 2026).
# GitHub runs deployment_status workflows from the deployment's commit, so a fix pushed to staging takes effect there.
jobs:
  gate:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      staging: ${{ steps.head.outputs.staging }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.event.deployment.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Is this deployment the head of staging?
        id: head
        run: |
          staging_sha=$(gh api "repos/${REPO}/branches/staging" --jq .commit.sha)
          if [ -n "$staging_sha" ] && [ "$DEPLOY_SHA" = "$staging_sha" ]; then
            echo "staging=true" >> "$GITHUB_OUTPUT"
            echo "Staging deployment of ${DEPLOY_SHA}: running smoke." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "Deployment ${DEPLOY_SHA} is not staging (head is ${staging_sha}): skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    needs: gate
    if: needs.gate.outputs.staging == 'true'
    concurrency:   # on this job only, so skipped lane deploys can't cancel a running staging check
      group: qa-staging
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      PRODUCTION_HOSTS: ${{ vars.PRODUCTION_HOSTS }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
      SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
      SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep @smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-staging-smoke
          path: |
            docs/qa-reports/
            .baseleap/reports/playwright-html/
          retention-days: 14
