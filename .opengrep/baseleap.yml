# .opengrep/baseleap.yml: Baseleap's own Opengrep (Semgrep-compatible) rules for the Next.js + Supabase stack (owned by bl-security).
# Copied from .claude/skills/sec-appsec/templates/opengrep-baseleap.yml at SEC1. Written for Baseleap; no registry rules copied.
#
# Project changes from the template (SEC1, "CI scan fix (Release 1)", 2026-11-26):
#   - baseleap-route-without-session-guard (template) is REPLACED by baseleap-route-without-auth-guard. The template rule
#     matched only `export async function GET(...)` and looked for requireSession(); every route in this project is
#     `export const GET = withApi(...)` and guards with requireStaff() or isCronRequest(), so the template rule could never
#     fire here (bl-devops, OPS1 "Release 1 CI diagnosis").
#   - baseleap-request-body-into-write and baseleap-ssrf-fetch-from-request are limited to shipped code (src/, without tests
#     and the MSW mocks). Their sources match any `x.json()`, so in test code they fire on API *responses* (a test opening a
#     signed photo URL it was given, a seed helper spreading options into an insert): not request input, not a server.
#   - baseleap-open-redirect knows the project's sanitizer: safeNextPath() (src/lib/server/auth/next-path.ts), the
#     invariant-22 allow-list `^/(requests|pipeline)(/[0-9a-f-]{36})?$` with a constant fallback.
# SEC1 "Opengrep self-test fix", 2026-11-26. On staging 291a344 the self-test flagged all 6 guarded fixture handlers:
#   - baseleap-route-without-auth-guard no longer recognises a guard with the deep-expression operator
#     `withApi(..., <... requireStaff(...) ...>)`. In CI that exclusion matched none of the guarded handlers, which are all
#     block-bodied arrows with the guard as a statement. The likely reason is that the operator does not reach the
#     statements of a block-bodied arrow passed as an argument. The guard is now matched as the FIRST statement of the
#     handler body, in the shapes this codebase uses (see the rule).
# These changes are proven on every scan: scripts/security-scan.sh writes a small fixture repo and scans it with THIS file
# (the comparison of .claude/skills/sec-appsec/tests/check-rules.mjs, inlined): every `expect:` line must fire and nothing
# else may. A failed self-test fails the scan, so a rule that cannot fire, or fires on guarded code, is reported, not trusted.
# Validate: opengrep scan --validate --config .opengrep/baseleap.yml
rules:
  - id: baseleap-service-role-import-in-ui
    message: The service-role client bypasses RLS and must never be reachable from UI code. Import it only in the paths SECURITY_MODEL.md allows.
    severity: ERROR
    languages: [regex]
    pattern-regex: from\s+['"]@/lib/server/admin['"]
    paths:
      include: ["src/app/(app)/**", "src/app/embed/**", "src/components/**", "src/hooks/**", "src/lib/api/**", "src/mocks/**"]

  - id: baseleap-service-role-key-outside-admin
    message: SUPABASE_SERVICE_ROLE_KEY is read outside src/lib/server/admin.ts / env.ts. Only those files may touch it.
    severity: ERROR
    languages: [regex]
    pattern-regex: SUPABASE_SERVICE_ROLE_KEY
    paths:
      include: ["src/**"]
      exclude: ["src/lib/server/admin.ts", "src/lib/server/env.ts"]

  - id: baseleap-public-env-secret-name
    message: A NEXT_PUBLIC_ variable is shipped to the browser. Secret-looking names must never be public.
    severity: ERROR
    languages: [regex]
    pattern-regex: NEXT_PUBLIC_[A-Z0-9_]*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|WEBHOOK|SK_)[A-Z0-9_]*

  - id: baseleap-route-without-auth-guard
    message: >-
      API route handler with no auth guard as its first statement. SECURITY_MODEL.md invariant 3: every /api route needs a
      staff bearer token (requireStaff), except GET /api/health, POST /api/auth/sign-in, the two formToken operations
      (POST /api/quote-requests, POST /api/quote-requests/[request_id]/submission) and /api/jobs/*, which need CRON_SECRET
      (isCronRequest, invariant 12). The guard must be the handler's first statement, as
      `const <name> = await requireStaff(...)`, `await requireStaff(...)` or `if (!isCronRequest(...)) throw ...`, so that
      a refused call reads and calls nothing. Invariant 11: every handler is `export const <METHOD> = withApi('<METHOD> <path>', ...)`,
      so a plain `export (async) function <METHOD>` is flagged too. The public list is matched on withApi's route label, which
      must be the real method and path. A new public operation needs a security-model change first. Confirm by reading the handler.
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["src/app/api/**/route.ts"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: export const $METHOD = withApi($ROUTE, ...)
                  - pattern: export const $METHOD = withApi<$T>($ROUTE, ...)
              # Skip only the four public operations (exact label, quotes optional).
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: ^(?!['"]?(?:GET /api/health|POST /api/auth/sign-in|POST /api/quote-requests|POST /api/quote-requests/\[request_id\]/submission)['"]?$)
          - pattern: export const $METHOD = async (...) => { ... }
          - pattern: export async function $METHOD(...) { ... }
          - pattern: export function $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
      # A withApi handler whose FIRST statement is a guard is fine. These are statement patterns, not the deep-expression
      # operator: `<... X ...>` excluded none of the guarded block-bodied handlers (self-test, staging 291a344).
      # The body has no leading `...`, so a guard placed after other work, or nested in a branch, is still flagged.
      # (The 405 handlers, `export const PUT = notAllowed`, are not withApi calls and never match above.)
      - pattern-not: |
          export const $METHOD = withApi(..., async (...) => {
            const $STAFF = await requireStaff(...);
            ...
          })
      - pattern-not: |
          export const $METHOD = withApi<$T>(..., async (...) => {
            const $STAFF = await requireStaff(...);
            ...
          })
      - pattern-not: |
          export const $METHOD = withApi(..., async (...) => {
            await requireStaff(...);
            ...
          })
      - pattern-not: |
          export const $METHOD = withApi<$T>(..., async (...) => {
            await requireStaff(...);
            ...
          })
      - pattern-not: |
          export const $METHOD = withApi(..., async (...) => {
            if (!isCronRequest(...)) throw $ERR;
            ...
          })
      - pattern-not: |
          export const $METHOD = withApi<$T>(..., async (...) => {
            if (!isCronRequest(...)) throw $ERR;
            ...
          })

  - id: baseleap-request-body-into-write
    message: The raw request body is written to the database (mass assignment). Parse it with the generated strict Zod schema and write only contract fields.
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["src/**"]
      exclude: ["**/*.test.ts", "**/*.test.tsx", "src/mocks/**"]
    pattern-either:
      - pattern: $C.from($T).insert(await $REQ.json())
      - pattern: $C.from($T).update(await $REQ.json())
      - pattern: $C.from($T).upsert(await $REQ.json())
      - pattern: $C.from($T).insert({ ..., ...$BODY, ... })
      - pattern: $C.from($T).update({ ..., ...$BODY, ... })

  - id: baseleap-select-star
    message: select('*') can leak internal columns into responses. Select explicit columns and map with toApi().
    severity: WARNING
    languages: [typescript]
    pattern: $Q.select("*")
    paths:
      include: ["src/lib/server/**", "src/app/api/**"]

  - id: baseleap-postmessage-wildcard
    message: postMessage to '*' lets any embedding page read the message. Target the GHL origin from the security model.
    severity: ERROR
    languages: [typescript]
    pattern: $W.postMessage($MSG, "*")

  - id: baseleap-dangerously-set-inner-html
    message: dangerouslySetInnerHTML renders raw HTML. Only allowed for sanitised, trusted content; confirm the source.
    severity: WARNING
    languages: [regex]
    pattern-regex: dangerouslySetInnerHTML
    paths:
      include: ["src/**"]

  - id: baseleap-cors-wildcard
    message: Access-Control-Allow-Origin '*' on an app route. Same-origin by default; embed routes follow the frame-ancestors decision.
    severity: ERROR
    languages: [regex]
    pattern-regex: Access-Control-Allow-Origin['"]?\s*[:,]\s*['"]\*['"]

  - id: baseleap-eval
    message: eval / new Function executes strings as code.
    severity: ERROR
    languages: [typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: baseleap-insecure-random-token
    message: Math.random() is not cryptographically secure. Use crypto.randomUUID() or crypto.getRandomValues() for tokens and ids.
    severity: WARNING
    languages: [typescript]
    pattern: Math.random()
    paths:
      include: ["src/lib/server/**", "src/app/api/**"]

  - id: baseleap-open-redirect
    message: Redirect target comes from the request. Allow-list internal paths (safeNextPath, SECURITY_MODEL.md invariant 22).
    severity: WARNING
    languages: [typescript]
    mode: taint
    pattern-sources:
      - pattern: $REQ.nextUrl.searchParams.get(...)
      - pattern: $SP.get("next")
      - pattern: $SP.get("redirect")
      - pattern: $SP.get("returnTo")
    pattern-sanitizers:
      - pattern: safeNextPath(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: redirect($URL, ...)
              - pattern-inside: NextResponse.redirect($URL, ...)
          - focus-metavariable: $URL

  - id: baseleap-ssrf-fetch-from-request
    message: An outgoing fetch URL comes from request data (SSRF). Use an allow-list of hosts.
    severity: ERROR
    languages: [typescript]
    mode: taint
    paths:
      include: ["src/**"]
      exclude: ["**/*.test.ts", "**/*.test.tsx", "src/mocks/**"]
    pattern-sources:
      - pattern: await $REQ.json()
      - pattern: $REQ.nextUrl.searchParams.get(...)
      - pattern: await $REQ.formData()
    pattern-sinks:
      - patterns:
          - pattern-inside: fetch($URL, ...)
          - focus-metavariable: $URL
