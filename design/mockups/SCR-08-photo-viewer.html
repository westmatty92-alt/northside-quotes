<!doctype html>
<!-- SCR-08 · Photo viewer (dialog over SCR-06) · Stories: US-012 · State: primary, photo 2 of 3 (AC-012.1, AC-012.2) -->
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-08 · Photo 2 of 3 · NQ-7K3M9P</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="viewer on-dark" role="dialog" aria-modal="true" aria-labelledby="v-title">
    <div class="viewer-bar">
      <div>
        <h1 id="v-title" class="viewer-count">Photo 2 of 3</h1>
        <p class="meta">NQ-7K3M9P, Dana Whitfield</p>
      </div>
      <button class="btn btn-secondary is-focus" type="button"><span class="ic ic-sm ic-x" aria-hidden="true"></span>Close</button>
    </div>

    <div class="viewer-stage">
      <figure class="viewer-frame" aria-label="Photo 2 of 3">
        <span class="ic ic-image" aria-hidden="true"></span>
        <figcaption class="meta">Stand-in for the homeowner's photo. The real photo fills this frame.</figcaption>
      </figure>
    </div>

    <div class="viewer-actions">
      <button class="btn btn-secondary" type="button"><span class="ic ic-sm ic-left" aria-hidden="true"></span>Previous photo</button>
      <button class="btn btn-secondary" type="button">Next photo<span class="ic ic-sm ic-right" aria-hidden="true"></span></button>
    </div>
  </div>
</body>
</html>
