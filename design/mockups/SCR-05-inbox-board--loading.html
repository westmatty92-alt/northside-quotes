<!doctype html>
<!-- SCR-05 · Pipeline tab · Stories: US-016, US-008 · State: loading (four column skeletons in the real layout, so nothing jumps when cards arrive) -->
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-05 · Pipeline · loading</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body class="has-tabs">
  <a class="skip" href="#main">Skip to the pipeline</a>
  <header class="nav on-dark">
    <div class="nav-inner">
      <a class="brand" href="#main" aria-label="Northside Plumbing, Requests"><svg class="wordmark" viewBox="0 0 260 64" role="img" aria-label="Northside Plumbing, Hamilton"><path class="wm-pipe-line" d="M10 54 V30 a14 14 0 0 1 14 -14 H44"/><rect class="wm-pipe" x="40" y="9" width="10" height="14" rx="2"/><rect class="wm-pipe" x="5" y="50" width="10" height="10" rx="2"/><text class="wm-name" x="62" y="36">NORTHSIDE</text><text class="wm-sub" x="63" y="55">PLUMBING · HAMILTON</text></svg></a>
      <nav class="nav-tabs" aria-label="Main">
        <a class="nav-tab" href="#main"><span class="ic ic-sm ic-list" aria-hidden="true"></span>Requests</a>
        <a class="nav-tab" href="#main" aria-current="page"><span class="ic ic-sm ic-board" aria-hidden="true"></span>Pipeline</a>
      </nav>
      <div class="nav-end"><span class="nav-user">Signed in as Owner</span><button class="btn-nav" type="button"><span class="ic ic-sm ic-out" aria-hidden="true"></span>Sign out</button></div>
    </div>
  </header>

  <main id="main" class="page page-wide" aria-busy="true">
    <div class="page-head"><h1>Pipeline</h1></div>
    <p class="sr-only" role="status">Loading the pipeline</p>

    <section class="week" aria-label="This week, loading">
      <div class="week-head"><h2 class="sheet-label">THIS WEEK</h2></div>
      <div class="week-tiles">
        <div class="tile"><span class="skel skel-lg sk-b"></span><span class="skel sk-a"></span></div>
        <div class="tile"><span class="skel skel-lg sk-b"></span><span class="skel sk-b"></span></div>
        <div class="tile"><span class="skel skel-lg sk-b"></span><span class="skel sk-b"></span></div>
      </div>
    </section>

    <div class="board" aria-label="Pipeline, loading">
      <section class="col" aria-label="New, loading">
        <h2 class="col-head"><span class="ic ic-inbox" aria-hidden="true"></span>New</h2>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
      </section>
      <section class="col" aria-label="Quoted, loading">
        <h2 class="col-head"><span class="ic ic-doc" aria-hidden="true"></span>Quoted</h2>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
      </section>
      <section class="col" aria-label="Won, loading">
        <h2 class="col-head"><span class="ic ic-check" aria-hidden="true"></span>Won</h2>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
      </section>
      <section class="col" aria-label="Lost, loading">
        <h2 class="col-head"><span class="ic ic-x-circle" aria-hidden="true"></span>Lost</h2>
        <div class="bcard"><span class="skel skel-lg sk-a"></span><span class="skel sk-a"></span><span class="skel sk-b"></span><span class="skel skel-lg"></span></div>
      </section>
    </div>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="#main"><span class="ic ic-list" aria-hidden="true"></span>Requests</a>
    <a class="tab" href="#main" aria-current="page"><span class="ic ic-board" aria-hidden="true"></span>Pipeline</a>
  </nav>
</body>
</html>
