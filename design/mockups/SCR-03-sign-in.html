<!doctype html>
<!-- SCR-03 · Staff sign-in · Stories: US-004 · State: primary -->
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCR-03 · Staff sign-in</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body class="bg-raised">
  <a class="skip" href="#main">Skip to sign-in</a>
  <header class="pub-head on-dark"><div class="pub-head-inner"><span class="brand"><svg class="wordmark" viewBox="0 0 260 64" role="img" aria-label="Northside Plumbing, Hamilton"><path class="wm-pipe-line" d="M10 54 V30 a14 14 0 0 1 14 -14 H44"/><rect class="wm-pipe" x="40" y="9" width="10" height="14" rx="2"/><rect class="wm-pipe" x="5" y="50" width="10" height="10" rx="2"/><text class="wm-name" x="62" y="36">NORTHSIDE</text><text class="wm-sub" x="63" y="55">PLUMBING · HAMILTON</text></svg></span></div></header>

  <main id="main" class="signin">
    <div class="sheet">
      <div class="stack">
        <h1>Staff sign-in</h1>
        <p class="muted">For the Northside owner and office helper.</p>
      </div>
      <form class="sheet">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" value="">
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <div class="search">
            <input class="input" id="pw" name="password" type="password" autocomplete="current-password" value="">
            <button class="btn btn-secondary" type="button" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p class="hint">Accounts are created by Baseleap. There is no sign-up on this page.</p>
    </div>
  </main>
</body>
</html>
